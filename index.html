<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Apps">
<title>My Apps</title>
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --text: #23201c;
  --text-dim: #6a655d;
  --border: #e0dbcf;
  --accent: #b8532c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16150f;
    --surface: #211f18;
    --text: #ebe7dd;
    --text-dim: #9a938a;
    --border: #38352c;
    --accent: #d97757;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  line-height: 1.5;
}
.container { max-width: 480px; width: 100%; }
h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.subtitle {
  color: var(--text-dim);
  margin-bottom: 32px;
  font-size: 15px;
}
.app-card {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  text-decoration: none;
  color: var(--text);
  margin-bottom: 12px;
  transition: all 0.15s;
}
.app-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.05);
}
.app-card .emoji {
  font-size: 32px;
  margin-bottom: 8px;
  display: block;
}
.app-card .name {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 4px;
}
.app-card .desc {
  font-size: 13px;
  color: var(--text-dim);
}
.footer {
  margin-top: 32px;
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
}
</style>
</head>
<body>
<div class="container">
  <h1>My Apps</h1>
  <p class="subtitle">Personal tools built for reading and language practice.</p>
  <a class="app-card" href="reader.html">
    <span class="emoji">📖</span>
    <div class="name">Read Aloud</div>
    <div class="desc">Upload a PDF, DOCX, or TXT and have it read to you.</div>
  </a>
  <a class="app-card" href="coach.html">
    <span class="emoji">🎙</span>
    <div class="name">Accent Coach</div>
    <div class="desc">Practice American English pronunciation with instant feedback.</div>
  </a>
  <p class="footer">Add to your home screen for an app-like experience.</p>
</div>
</body>
</html>
